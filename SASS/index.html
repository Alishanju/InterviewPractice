<div class="space-top"></div>

	<div class="flight-card">
		<button class="flight-card__favorite-btn button button--icon button--transparent-blur">
			<span class="material-symbols-outlined">favorite</span>
		</button>

		<div class="flight-card__inner">
			<div class="flight-card__destination">
				<h4 class="flight-card__destination-title">New York</h4>
				<p class="flight-card__destination-class">Economy</p>
			</div>

			<div class="flight-card__search">
				<div class="flight-card__search-info">
					<p class="flight-card__price">
						<span class="material-symbols-outlined">sell</span>
						<span>from <b>£120</b></span>
					</p>
					<p class="flight-card__airport">
						<span class="material-symbols-outlined">airplane_ticket</span>
